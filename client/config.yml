audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  wake_word: "carlson"

stt:
  model: "base"  # Whisper model size
  language: "en"
  device: "cpu"  # or "cuda"

tts:
  voice: "en_US-lessac-medium"
  speed: 1.0

llm:
  model: "carlson"  # Name of your Ollama model
  temperature: 0.7
  max_tokens: 500
  timeout: 30
  stream: false